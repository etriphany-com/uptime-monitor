# Checks if your websites are up, creating/closing issues using the result

name: Uptime CI
on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [uptime]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false    
jobs:
  release:
    name: Check status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT || github.token  }}
      - name: Check endpoint status
        uses: upptime/uptime-monitor@v1.46.5
        with:
          command: "update"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}